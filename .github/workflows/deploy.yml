name: Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - claude/mortgage-search-microservice-klXBo   # your default production branch
  workflow_dispatch:        # allows manual trigger from GitHub UI

env:
  AWS_REGION: us-west-2                             # Oregon — matches your EC2 region
  ECR_REPOSITORY: opus-ecr                          # must match the ECR repo name you created
  CONTAINER_NAME: opus-one-app
  DOMAIN: opusone-ai.orchestrate.com                # production domain

jobs:
  # ─── Job 1: Build Docker image and push to ECR ───────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ─── Job 2: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy monitoring config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "monitoring/"
          target: "~/opus-monitoring/"
          strip_components: 1

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # ── Shared Docker network (app + monitoring agents communicate over it) ──
            docker network create opus-monitoring 2>/dev/null || true

            # ── Login to ECR ───────────────────────────────────────────────────────
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # ── Pull latest image ──────────────────────────────────────────────────
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

            # ── Stop and remove existing container ─────────────────────────────────
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            # ── Start app container (joined to monitoring network) ─────────────────
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network opus-monitoring \
              -p 3000:3000 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e OPENAI_MODEL="gpt-4o-mini" \
              -e PORT="3000" \
              -e BROWSER_HEADLESS="true" \
              -e MAX_CONCURRENT_SEARCHES="3" \
              -e SEARCH_TIMEOUT_MS="180000" \
              -e CACHE_TTL_HOURS="4" \
              -e CACHE_MAX_SIZE="1000" \
              -e CAPSOLVER_API_KEY="${{ secrets.CAPSOLVER_API_KEY }}" \
              ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

            # ── Deploy / refresh monitoring stack (Alloy + node-exporter) ──────────
            cd ~/opus-monitoring

            # Write .env without leading whitespace (heredoc indentation breaks parsing)
            printf '%s\n' \
              "GRAFANA_PROM_URL=${{ secrets.GRAFANA_PROM_URL }}" \
              "GRAFANA_PROM_USER=${{ secrets.GRAFANA_PROM_USER }}" \
              "GRAFANA_LOKI_URL=${{ secrets.GRAFANA_LOKI_URL }}" \
              "GRAFANA_LOKI_USER=${{ secrets.GRAFANA_LOKI_USER }}" \
              "GRAFANA_API_KEY=${{ secrets.GRAFANA_API_KEY }}" \
              > .env

            docker compose -f docker-compose.yml --env-file .env pull --quiet
            docker compose -f docker-compose.yml --env-file .env up -d --remove-orphans

            # ── Clean up old images ────────────────────────────────────────────────
            docker image prune -f

            # ── Diagnostics ───────────────────────────────────────────────────────
            echo ""
            echo "=== Running containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "=== Alloy startup logs ==="
            sleep 5
            docker logs opus-alloy --tail=30 2>&1 || echo "opus-alloy not found"
